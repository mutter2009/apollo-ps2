# Apollo Save Tool (PS2) — 中文版在线编译工作流
# 用法：把本文件放到仓库的 .github/workflows/ 下（例如 build-zh.yml），
# 并确保仓库根目录已有 apply_i18n.py 与 DATA/FONT.OTF，然后 push / 手动触发。
# 编译完成后到 Actions 标签页下载产物（APOLLO.ELF + APOLLO/DATA/FONT.OTF）。

name: PS2 Build (中文版)

on:
  workflow_dispatch:   # 仅在 Actions 页手动点 “Run workflow” 触发，push 不自动编译

env:
  BUILD_TYPE: Release

jobs:
  ps2-zh:
    name: Build Chinese (PS2)
    runs-on: ubuntu-latest
    # 预装好 PS2 工具链（ee-gcc / PS2SDK）的镜像，无需自行安装
    container: ps2dev/ps2dev@sha256:96d40a532972fd84f41fd418ef2b51a5dffd444f0bbb4df2fcf4c55ce0af32df

    steps:
      - uses: actions/checkout@v4

      - name: 应用中文翻译 (apply_i18n.py) + ⭕确定/✕返回
        run: |
          apk add python3 || true
          python3 apply_i18n.py --swap-buttons

      - name: Install build dependencies
        run: |
          apk update
          apk add gmp mpc1 mpfr4 make cmake git python3
          git clone https://github.com/bucanero/dbglogger
          git clone --branch v1.4.0 https://github.com/bucanero/apollo-lib
          git clone https://github.com/bucanero/oosdk_libraries

      - name: build dbglogger
        run: |
          cd dbglogger
          make -f Makefile.ps2 install

      - name: build polarssl
        run: |
          cd oosdk_libraries/polarssl-1.3.9
          cmake --toolchain $PS2DEV/ps2sdk/ps2dev.cmake . -DCMAKE_BUILD_TYPE=Release
          make polarssl
          cp library/libpolarssl.a $PS2DEV/ps2sdk/ports/lib
          cp -R include/polarssl $PS2DEV/ps2sdk/ports/include/polarssl

      - name: build apollo lib
        run: |
          cd apollo-lib
          make -f Makefile.ps2 install

      - name: Configure project
        run: |
          cmake -S . \
                -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/ps2sdk/ps2dev.cmake \
                -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build project
        run: make

      - name: 检查字体文件是否已提交
        run: |
          echo "当前仓库根目录内容："
          ls -la
          echo "data/ 目录内容："
          ls -la data/ || true
          # 字体优先级（优先体积小且转为 TrueType 轮廓的版本，PS2 上更稳定）：
          # FONT_MIN.ttf > FONT_MIN.OTF > FONT_MID.OTF > FONT_LITE.OTF > FONT.OTF
          if [ -f "data/FONT_MIN.ttf" ]; then
            FONT_NAME="FONT_MIN.ttf"
          elif [ -f "data/FONT_MIN.OTF" ]; then
            FONT_NAME="FONT_MIN.OTF"
          elif [ -f "data/FONT_MID.OTF" ]; then
            FONT_NAME="FONT_MID.OTF"
          elif [ -f "data/FONT_LITE.OTF" ]; then
            FONT_NAME="FONT_LITE.OTF"
          elif [ -f "data/FONT.OTF" ]; then
            FONT_NAME="FONT.OTF"
          else
            echo "❌ 错误：仓库根目录下未找到 data/FONT_MIN.ttf / FONT_MIN.OTF / FONT_MID.OTF / FONT_LITE.OTF / FONT.OTF。"
            echo "   请把字体文件放到仓库根目录的 data/ 下，并提交后再运行工作流。"
            exit 1
          fi
          echo "FONT_NAME=${FONT_NAME}" >> $GITHUB_ENV
          echo "✅ 将使用字体：${FONT_NAME}"

      - name: 复制中文字体到部署目录
        run: |
          mkdir -p APOLLO/DATA
          cp "data/${FONT_NAME}" APOLLO/DATA/FONT.OTF
          echo "部署字体大小："
          ls -lh APOLLO/DATA/FONT.OTF

      - name: Compress binary
        run: |
          ps2-packer apollo-ps2.elf APOLLO.ELF
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Upload application (ELF + 字体)
        uses: actions/upload-artifact@v4
        with:
          name: apollo-ps2-zh_${{ env.sha_name }}
          path: |
            APOLLO.ELF
            APOLLO/DATA/FONT.OTF
          if-no-files-found: error
